# dsh-smart-websearch bundle patch: load the package main entry as a host Cordis plugin.
# It registers ctx.web search/fetch providers. To actually route the built-in
# web_search / web_fetch tools through it, set in the profile cordis.patch.yml:
#   - id: web
#     config:
#       searchProvider: smart-websearch
#       fetchProvider: smart-webfetch
# Defaults live in lib/index.js Config; override via the profile patch (id: dsh-smart-websearch).
- insert:
    - id: dsh-smart-websearch
      name: dsh-smart-websearch
